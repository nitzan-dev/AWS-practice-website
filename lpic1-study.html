// ─── PROGRESS STORE ──────────────────────────────────────────────────────────

function useProgress() {
  const [progress, setProgress] = useState(() => {
    try { return JSON.parse(localStorage.getItem('lpic1_progress') || '{}'); } catch { return {}; }
  });

  const saveAnswer = useCallback((qid, correct, selected) => {
    setProgress(prev => {
      const next = { ...prev, [qid]: { correct, selected, timestamp: Date.now() } };
      localStorage.setItem('lpic1_progress', JSON.stringify(next));
      return next;
    });
  }, []);

  const resetTopic = useCallback((topicId) => {
    setProgress(prev => {
      const next = { ...prev };
      EXAM_TOPICS.find(t => t.id === topicId)?.questions.forEach(q => delete next[q.id]);
      localStorage.setItem('lpic1_progress', JSON.stringify(next));
      return next;
    });
  }, []);

  const resetAll = useCallback(() => {
    setProgress({});
    localStorage.removeItem('lpic1_progress');
  }, []);

  return { progress, saveAnswer, resetTopic, resetAll };
}

// ─── PROGRESS RING ───────────────────────────────────────────────────────────

const ProgressRing = ({ pct, size = 56, stroke = 4, color = '#22C55E' }) => {
  const r = (size - stroke * 2) / 2;
  const circ = 2 * Math.PI * r;
  const offset = circ - (pct / 100) * circ;
  return (
    <svg width={size} height={size}>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="#1E293B" strokeWidth={stroke} />
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth={stroke}
        strokeDasharray={circ} strokeDashoffset={offset} strokeLinecap="round"
        className="progress-ring" />
      <text x={size/2} y={size/2 + 1} textAnchor="middle" dominantBaseline="middle"
        fill={color} fontSize={size * 0.22} fontWeight="700" fontFamily="Plus Jakarta Sans">
        {Math.round(pct)}%
      </text>
    </svg>
  );
};

// ─── QUESTION CARD ───────────────────────────────────────────────────────────

const QuestionCard = ({ question, onAnswer, savedAnswer }) => {
  const [selected, setSelected] = useState(savedAnswer ? savedAnswer.selected : []);
  const [submitted, setSubmitted] = useState(!!savedAnswer);
  const [showExpl, setShowExpl] = useState(false);

  const isMulti = question.type === 'multi';

  const toggle = (idx) => {
    if (submitted) return;
    if (isMulti) {
      setSelected(prev => prev.includes(idx) ? prev.filter(i => i !== idx) : [...prev, idx]);
    } else {
      setSelected([idx]);
    }
  };

  const submit = () => {
    if (selected.length === 0) return;
    const correct = JSON.stringify([...selected].sort()) === JSON.stringify([...question.correct].sort());
    setSubmitted(true);
    onAnswer(question.id, correct, selected);
  };

  const getOptionClass = (idx) => {
    if (!submitted) return selected.includes(idx) ? 'bg-blue-900/40 border-info' : 'bg-surface border-border';
    const isCorrect = question.correct.includes(idx);
    const isSelected = selected.includes(idx);
    if (isCorrect) return 'correct';
    if (isSelected && !isCorrect) return 'incorrect';
    return 'bg-surface border-border opacity-50';
  };

  const wasCorrect = submitted && JSON.stringify([...selected].sort()) === JSON.stringify([...question.correct].sort());

  return (
    <div className="fade-in">
      <div className="flex items-start gap-3 mb-4">
        <div className="flex-1">
          <p className="text-textPrimary text-base leading-relaxed font-medium">{question.text}</p>
          {isMulti && <p className="text-textMuted text-xs mt-1">(Select all that apply)</p>}
        </div>
        {submitted && (
          <div className={`flex-shrink-0 w-8 h-8 rounded-full flex items-center justify-center ${wasCorrect ? 'bg-accent/20 text-accent' : 'bg-danger/20 text-danger'}`}>
            <Icon name={wasCorrect ? 'check' : 'x'} size={14} />
          </div>
        )}
      </div>

      <div className="space-y-2 mb-4">
        {question.options.map((opt, idx) => (
          <button
            key={idx}
            onClick={() => toggle(idx)}
            disabled={submitted}
            className={`option-btn w-full text-left px-4 py-3 rounded-lg border text-sm cursor-pointer ${getOptionClass(idx)} ${!submitted ? 'hover:cursor-pointer' : 'cursor-default'}`}
          >
            <div className="flex items-start gap-3">
              <span className={`flex-shrink-0 w-5 h-5 rounded border flex items-center justify-center text-xs font-mono mt-0.5 ${
                selected.includes(idx) ? 'bg-info border-info text-white' : 'border-border text-textMuted'
              }`}>
                {isMulti ? (selected.includes(idx) ? '✓' : '') : String.fromCharCode(65 + idx)}
              </span>
              <span className="font-mono text-xs leading-relaxed">{opt}</span>
            </div>
          </button>
        ))}
      </div>

      {!submitted && (
        <button
          onClick={submit}
          disabled={selected.length === 0}
          className="px-5 py-2.5 bg-accent hover:bg-accentHover disabled:opacity-40 disabled:cursor-not-allowed text-white text-sm font-semibold rounded-lg transition-all duration-150 cursor-pointer"
        >
          Submit Answer
        </button>
      )}

      {submitted && (
        <div className="mt-3">
          <button
            onClick={() => setShowExpl(!showExpl)}
            className="flex items-center gap-2 text-info text-sm hover:text-blue-300 transition-colors cursor-pointer"
          >
            <Icon name="info" size={14} />
            {showExpl ? 'Hide explanation' : 'Show explanation'}
          </button>
          {showExpl && (
            <div className="mt-2 p-3 bg-surface/60 border border-border rounded-lg text-textMuted text-sm leading-relaxed terminal-text">
              {question.explanation}
            </div>
          )}
        </div>
      )}
    </div>
  );
};

const MockExam = ({ onBack, progress, saveAnswer }) => {
  const [examSet] = useState(() => {
    const shuffled = [...ALL_QUESTIONS].sort(() => Math.random() - 0.5);
    return shuffled.slice(0, 30);
  });
  const [current, setCurrent] = useState(0);
  const [localAnswers, setLocalAnswers] = useState({});
  const [finished, setFinished] = useState(false);
  const [timeLeft, setTimeLeft] = useState(60 * 60); // 60 min
  const timerRef = useRef(null);

  useEffect(() => {
    timerRef.current = setInterval(() => {
      setTimeLeft(t => {
        if (t <= 1) { clearInterval(timerRef.current); setFinished(true); return 0; }
        return t - 1;
      });
    }, 1000);
    return () => clearInterval(timerRef.current);
  }, []);

  const handleAnswer = (id, correct, selected) => {
    setLocalAnswers(prev => ({ ...prev, [id]: { correct, selected } }));
    saveAnswer(id, correct, selected);
  };

  const score = Object.values(localAnswers).filter(a => a.correct).length;
  const pct = Math.round((score / examSet.length) * 100);
  const mm = String(Math.floor(timeLeft / 60)).padStart(2, '0');
  const ss = String(timeLeft % 60).padStart(2, '0');
  const passed = pct >= 60;

  if (finished || Object.keys(localAnswers).length === examSet.length) {
    return (
      <div className="max-w-2xl mx-auto fade-in text-center py-10">
        <div className={`inline-flex items-center justify-center w-20 h-20 rounded-full mb-6 ${passed ? 'bg-accent/20' : 'bg-danger/20'}`}>
          <Icon name={passed ? 'trophy' : 'x'} size={36} className={passed ? 'text-accent' : 'text-danger'} />
        </div>
        <h2 className="text-3xl font-bold text-textPrimary mb-2">{passed ? 'Exam Passed!' : 'Keep Studying'}</h2>
        <p className="text-textMuted mb-6">You scored {score}/{examSet.length} ({pct}%). Pass mark is 60%.</p>
        <div className="inline-block mb-8"><ProgressRing pct={pct} size={100} stroke={6} color={passed ? '#22C55E' : '#EF4444'} /></div>
        <div className="grid grid-cols-3 gap-4 mb-8">
          <div className="bg-surface border border-border rounded-xl p-4">
            <div className="text-2xl font-bold text-accent">{score}</div>
            <div className="text-textMuted text-sm">Correct</div>
          </div>
          <div className="bg-surface border border-border rounded-xl p-4">
            <div className="text-2xl font-bold text-danger">{examSet.length - score}</div>
            <div className="text-textMuted text-sm">Wrong</div>
          </div>
          <div className="bg-surface border border-border rounded-xl p-4">
            <div className="text-2xl font-bold text-info">{pct}%</div>
            <div className="text-textMuted text-sm">Score</div>
          </div>
        </div>
        <button onClick={onBack} className="px-6 py-3 bg-accent hover:bg-accentHover text-white font-semibold rounded-xl cursor-pointer transition-all">
          Back to Dashboard
        </button>
      </div>
    );
  }

  const answered = Object.keys(localAnswers).length;

  return (
    <div className="max-w-2xl mx-auto fade-in">
      <div className="flex items-center gap-3 mb-4">
        <button onClick={onBack} className="p-2 hover:bg-surface rounded-lg text-textMuted hover:text-textPrimary transition-colors cursor-pointer">
          <Icon name="back" size={18} />
        </button>
        <div className="flex-1">
          <h2 className="text-lg font-bold text-textPrimary">Mock Exam — 30 Questions</h2>
          <p className="text-textMuted text-sm">{answered}/30 answered</p>
        </div>
        <div className={`font-mono text-lg font-bold px-3 py-1 rounded-lg ${timeLeft < 300 ? 'text-danger bg-danger/10' : 'text-accent bg-accent/10'}`}>
          {mm}:{ss}
        </div>
      </div>

      <div className="w-full h-1.5 bg-surface rounded-full mb-4">
        <div className="h-1.5 bg-accent rounded-full transition-all duration-300" style={{ width: `${(answered/30)*100}%` }} />
      </div>

      <div className="flex gap-1.5 mb-5 flex-wrap">
        {examSet.map((q, i) => (
          <button key={i} onClick={() => setCurrent(i)}
            className={`w-8 h-8 rounded text-xs font-bold transition-all cursor-pointer ${
              i === current ? 'bg-info text-white' :
              localAnswers[q.id]?.correct ? 'bg-accent/20 text-accent' :
              localAnswers[q.id] ? 'bg-danger/20 text-danger' :
              'bg-surface text-textMuted hover:bg-border'
            }`}>
            {i + 1}
          </button>
        ))}
      </div>

      <div className="bg-surface border border-border rounded-xl p-6 mb-4">
        <div className="text-xs font-mono text-textDim mb-4 flex items-center gap-2">
          <Icon name="terminal" size={12} />
          Q{current + 1} — {EXAM_TOPICS.find(t => t.id === examSet[current].topic)?.label}
        </div>
        <QuestionCard
          key={examSet[current].id}
          question={examSet[current]}
          savedAnswer={localAnswers[examSet[current].id]}
          onAnswer={handleAnswer}
        />
      </div>

      <div className="flex justify-between">
        <button onClick={() => setCurrent(Math.max(0, current - 1))} disabled={current === 0}
          className="flex items-center gap-2 px-4 py-2 bg-surface border border-border text-textMuted hover:text-textPrimary rounded-lg text-sm disabled:opacity-30 transition-all cursor-pointer">
          <Icon name="back" size={14} /> Previous
        </button>
        {answered === examSet.length ? (
          <button onClick={() => setFinished(true)}
            className="flex items-center gap-2 px-6 py-2 bg-accent hover:bg-accentHover text-white font-semibold rounded-lg text-sm cursor-pointer transition-all">
            Finish Exam <Icon name="trophy" size={14} />
          </button>
        ) : (
          <button onClick={() => setCurrent(Math.min(examSet.length - 1, current + 1))} disabled={current === examSet.length - 1}
            className="flex items-center gap-2 px-4 py-2 bg-surface border border-border text-textMuted hover:text-textPrimary rounded-lg text-sm disabled:opacity-30 transition-all cursor-pointer">
            Next <Icon name="arrow" size={14} />
          </button>
        )}
      </div>
    </div>
  );
};

// ─── DASHBOARD ────────────────────────────────────────────────────────────────

const Dashboard = ({ progress, onTopicSelect, onMockExam, onStats, resetAll }) => {
  const totalQ = ALL_QUESTIONS.length;
  const answeredQ = Object.keys(progress).length;
  const correctQ = Object.values(progress).filter(a => a.correct).length;
  const overallPct = totalQ > 0 ? Math.round((correctQ / totalQ) * 100) : 0;

  return (
    <div className="fade-in space-y-8">
      {/* Hero */}
      <div className="relative overflow-hidden bg-gradient-to-br from-surface to-bg border border-border rounded-2xl p-8">
        <div className="absolute top-0 right-0 w-64 h-64 bg-accent/5 rounded-full -translate-y-1/2 translate-x-1/2 blur-3xl" />
        <div className="relative flex items-start justify-between gap-4 flex-wrap">
          <div>
            <div className="flex items-center gap-2 mb-2">
              <Icon name="terminal" size={16} className="text-accent" />
              <span className="text-accent text-sm font-mono font-semibold tracking-wider">LPIC-1 STUDY HUB</span>
            </div>
            <h1 className="text-3xl font-bold text-textPrimary glow-accent mb-2">Linux Professional<br />Institute Certification</h1>
            <p className="text-textMuted text-sm max-w-md">
              Practice questions for LPIC-1 exams 101 and 102. All topics covered, same question structure as the real exam.
            </p>
            <div className="flex gap-3 mt-5">
              <button onClick={onMockExam}
                className="flex items-center gap-2 px-5 py-2.5 bg-accent hover:bg-accentHover text-white font-semibold rounded-xl text-sm transition-all cursor-pointer">
                <Icon name="exam" size={15} /> Take Mock Exam
              </button>
              <button onClick={resetAll}
                className="flex items-center gap-2 px-5 py-2.5 bg-surface hover:bg-border border border-border text-textMuted hover:text-textPrimary rounded-xl text-sm transition-all cursor-pointer">
                <Icon name="reset" size={15} /> Reset All
              </button>
            </div>
          </div>
          <div className="flex flex-col items-center gap-2">
            <ProgressRing pct={overallPct} size={80} stroke={5} />
            <span className="text-textMuted text-xs">{answeredQ}/{totalQ} answered</span>
          </div>
        </div>
      </div>

      {/* Stats row */}
      <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
        {[
          { label: 'Total Questions', value: totalQ, color: 'text-info' },
          { label: 'Answered', value: answeredQ, color: 'text-warning' },
          { label: 'Correct', value: correctQ, color: 'text-accent' },
          { label: 'Score', value: `${overallPct}%`, color: overallPct >= 60 ? 'text-accent' : 'text-danger' },
        ].map(s => (
          <div key={s.label} className="bg-surface border border-border rounded-xl p-4 card-hover">
            <div className={`text-2xl font-bold ${s.color}`}>{s.value}</div>
            <div className="text-textMuted text-xs mt-1">{s.label}</div>
          </div>
        ))}
      </div>

      {/* Exam 101 */}
      <section>
        <div className="flex items-center gap-2 mb-4">
          <span className="px-2 py-0.5 bg-info/20 text-info text-xs font-mono font-bold rounded">EXAM 101</span>
          <h2 className="text-textPrimary font-semibold">System & Commands</h2>
        </div>
        <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
          {EXAM_TOPICS.filter(t => t.exam === '101').map(topic => {
            const topicQs = topic.questions;
            const done = topicQs.filter(q => progress[q.id]).length;
            const correct = topicQs.filter(q => progress[q.id]?.correct).length;
            const pct = topicQs.length > 0 ? Math.round((done / topicQs.length) * 100) : 0;
            return (
              <button key={topic.id} onClick={() => onTopicSelect(topic.id)}
                className="bg-surface border border-border hover:border-info/50 rounded-xl p-5 text-left card-hover transition-all cursor-pointer group">
                <div className="flex items-start justify-between gap-3 mb-3">
                  <div>
                    <h3 className="font-semibold text-textPrimary text-sm group-hover:text-info transition-colors">{topic.label}</h3>
                    <p className="text-textDim text-xs mt-1">{topicQs.length} questions · weight {topic.weight}</p>
                  </div>
                  <ProgressRing pct={pct} size={40} stroke={3} color={pct === 100 ? '#22C55E' : '#3B82F6'} />
                </div>
                <div className="w-full h-1 bg-bg rounded-full overflow-hidden">
                  <div className="h-1 bg-info rounded-full transition-all" style={{ width: `${pct}%` }} />
                </div>
                <div className="flex justify-between mt-2">
                  <span className="text-textDim text-xs">{done}/{topicQs.length} done</span>
                  <span className="text-accent text-xs">{correct} correct</span>
                </div>
              </button>
            );
          })}
        </div>
      </section>

      {/* Exam 102 */}
      <section>
        <div className="flex items-center gap-2 mb-4">
          <span className="px-2 py-0.5 bg-accent/20 text-accent text-xs font-mono font-bold rounded">EXAM 102</span>
          <h2 className="text-textPrimary font-semibold">Admin, Services & Security</h2>
        </div>
        <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
          {EXAM_TOPICS.filter(t => t.exam === '102').map(topic => {
            const topicQs = topic.questions;
            const done = topicQs.filter(q => progress[q.id]).length;
            const correct = topicQs.filter(q => progress[q.id]?.correct).length;
            const pct = topicQs.length > 0 ? Math.round((done / topicQs.length) * 100) : 0;
            return (
              <button key={topic.id} onClick={() => onTopicSelect(topic.id)}
                className="bg-surface border border-border hover:border-accent/50 rounded-xl p-5 text-left card-hover transition-all cursor-pointer group">
                <div className="flex items-start justify-between gap-3 mb-3">
                  <div>
                    <h3 className="font-semibold text-textPrimary text-sm group-hover:text-accent transition-colors">{topic.label}</h3>
                    <p className="text-textDim text-xs mt-1">{topicQs.length} questions · weight {topic.weight}</p>
                  </div>
                  <ProgressRing pct={pct} size={40} stroke={3} color={pct === 100 ? '#22C55E' : '#22C55E'} />
                </div>
                <div className="w-full h-1 bg-bg rounded-full overflow-hidden">
                  <div className="h-1 bg-accent rounded-full transition-all" style={{ width: `${pct}%` }} />
                </div>
                <div className="flex justify-between mt-2">
                  <span className="text-textDim text-xs">{done}/{topicQs.length} done</span>
                  <span className="text-accent text-xs">{correct} correct</span>
                </div>
              </button>
            );
          })}
        </div>
      </section>

      {/* Cheat sheet */}
      <section>
        <div className="flex items-center gap-2 mb-4">
          <Icon name="terminal" size={14} className="text-warning" />
          <h2 className="text-textPrimary font-semibold">Quick Reference</h2>
        </div>
        <div className="bg-surface border border-border rounded-xl p-5 overflow-x-auto">
          <table className="w-full text-sm terminal-text">
            <thead>
              <tr className="text-textDim text-xs border-b border-border">
                <th className="text-left pb-2 pr-6">Command</th>
                <th className="text-left pb-2 pr-6">Description</th>
                <th className="text-left pb-2">Topic</th>
              </tr>
            </thead>
            <tbody className="text-textMuted">
              {[
                ['lspci / lsusb', 'List PCI / USB devices', '101'],
                ['systemctl get-default', 'Show default systemd target', '101'],
                ['dpkg -i pkg.deb', 'Install local .deb package', '102'],
                ['ldd /bin/ls', 'Show shared library deps', '102'],
                ['find . -mtime -1', 'Files modified < 24h ago', '103'],
                ['grep -rn "pattern" .', 'Recursive search with line numbers', '103'],
                ['chmod 755 / chown', 'Set permissions / ownership', '104'],
                ['ln -s target link', 'Create symbolic link', '104'],
                ['usermod -aG grp usr', 'Add user to supplementary group', '107'],
                ['crontab -e / -l', 'Edit / list user cron jobs', '107'],
                ['ss -tuln', 'Show listening ports (modern)', '109'],
                ['ip route show', 'Show routing table (modern)', '109'],
                ['ssh-keygen -t ed25519', 'Generate Ed25519 SSH key pair', '110'],
                ['iptables -L -n -v', 'List firewall rules', '110'],
              ].map(([cmd, desc, topic]) => (
                <tr key={cmd} className="border-b border-border/30 hover:bg-bg/50">
                  <td className="py-2 pr-6 text-accent font-mono text-xs">{cmd}</td>
                  <td className="py-2 pr-6 text-xs">{desc}</td>
                  <td className="py-2"><span className="px-1.5 py-0.5 bg-surface border border-border rounded text-xs text-textDim">{topic}</span></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </section>
    </div>
  );
};

// ─── APP ──────────────────────────────────────────────────────────────────────

const App = () => {
  const { progress, saveAnswer, resetTopic, resetAll } = useProgress();
  const [view, setView] = useState('dashboard'); // 'dashboard' | 'topic:{id}' | 'mock'
  const [sidebarOpen, setSidebarOpen] = useState(false);

  const currentTopicId = view.startsWith('topic:') ? view.split(':')[1] : null;
  const isMock = view === 'mock';

  const totalQ = ALL_QUESTIONS.length;
  const answeredQ = Object.keys(progress).length;
  const overallPct = totalQ > 0 ? Math.round((Object.values(progress).filter(a => a.correct).length / totalQ) * 100) : 0;

  return (
    <div className="min-h-screen bg-bg flex">
      {/* Sidebar overlay (mobile) */}
      {sidebarOpen && (
        <div className="fixed inset-0 bg-black/60 z-30 md:hidden" onClick={() => setSidebarOpen(false)} />
      )}

      {/* Sidebar */}
      <aside className={`fixed left-0 top-0 h-full w-64 bg-surface border-r border-border z-40 flex flex-col transition-transform duration-300 ${sidebarOpen ? 'translate-x-0' : '-translate-x-full md:translate-x-0'}`}>
        {/* Logo */}
        <div className="p-5 border-b border-border">
          <div className="flex items-center gap-3">
            <div className="w-8 h-8 bg-accent/20 rounded-lg flex items-center justify-center">
              <Icon name="terminal" size={16} className="text-accent" />
            </div>
            <div>
              <div className="font-bold text-textPrimary text-sm">LPIC-1</div>
              <div className="text-textDim text-xs font-mono">Study Hub</div>
            </div>
          </div>
        </div>

        {/* Nav */}
        <nav className="flex-1 overflow-y-auto p-3 space-y-1">
          <button onClick={() => { setView('dashboard'); setSidebarOpen(false); }}
            className={`sidebar-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm cursor-pointer ${view === 'dashboard' ? 'bg-accent/10 text-accent' : 'text-textMuted hover:text-textPrimary'}`}>
            <Icon name="home" size={15} /> Dashboard
          </button>
          <button onClick={() => { setView('mock'); setSidebarOpen(false); }}
            className={`sidebar-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm cursor-pointer ${isMock ? 'bg-accent/10 text-accent' : 'text-textMuted hover:text-textPrimary'}`}>
            <Icon name="exam" size={15} /> Mock Exam
          </button>

          <div className="pt-3 pb-1">
            <p className="text-textDim text-xs font-mono px-3 pb-1">EXAM 101</p>
          </div>
          {EXAM_TOPICS.filter(t => t.exam === '101').map(topic => {
            const done = topic.questions.filter(q => progress[q.id]).length;
            const isActive = view === `topic:${topic.id}`;
            return (
              <button key={topic.id} onClick={() => { setView(`topic:${topic.id}`); setSidebarOpen(false); }}
                className={`sidebar-item w-full flex items-center justify-between gap-2 px-3 py-2 rounded-lg text-xs cursor-pointer ${isActive ? 'bg-info/10 text-info' : 'text-textMuted hover:text-textPrimary'}`}>
                <span className="truncate">{topic.label.split(':')[1]?.trim() || topic.label}</span>
                <span className={`flex-shrink-0 text-xs font-mono ${done === topic.questions.length && done > 0 ? 'text-accent' : 'text-textDim'}`}>
                  {done}/{topic.questions.length}
                </span>
              </button>
            );
          })}

          <div className="pt-3 pb-1">
            <p className="text-textDim text-xs font-mono px-3 pb-1">EXAM 102</p>
          </div>
          {EXAM_TOPICS.filter(t => t.exam === '102').map(topic => {
            const done = topic.questions.filter(q => progress[q.id]).length;
            const isActive = view === `topic:${topic.id}`;
            return (
              <button key={topic.id} onClick={() => { setView(`topic:${topic.id}`); setSidebarOpen(false); }}
                className={`sidebar-item w-full flex items-center justify-between gap-2 px-3 py-2 rounded-lg text-xs cursor-pointer ${isActive ? 'bg-accent/10 text-accent' : 'text-textMuted hover:text-textPrimary'}`}>
                <span className="truncate">{topic.label.split(':')[1]?.trim() || topic.label}</span>
                <span className={`flex-shrink-0 text-xs font-mono ${done === topic.questions.length && done > 0 ? 'text-accent' : 'text-textDim'}`}>
                  {done}/{topic.questions.length}
                </span>
              </button>
            );
          })}
        </nav>

        {/* Bottom stats */}
        <div className="p-4 border-t border-border">
          <div className="flex items-center justify-between mb-2">
            <span className="text-textDim text-xs">Overall Progress</span>
            <span className="text-accent text-xs font-bold font-mono">{overallPct}%</span>
          </div>
          <div className="w-full h-1.5 bg-bg rounded-full">
            <div className="h-1.5 bg-accent rounded-full transition-all" style={{ width: `${overallPct}%` }} />
          </div>
          <div className="text-textDim text-xs mt-1">{answeredQ}/{totalQ} questions answered</div>
        </div>
      </aside>

      {/* Main */}
      <main className="flex-1 md:ml-64 min-h-screen flex flex-col">
        {/* Top bar */}
        <header className="sticky top-0 z-20 bg-bg/90 backdrop-blur border-b border-border px-4 py-3 flex items-center gap-4">
          <button onClick={() => setSidebarOpen(!sidebarOpen)} className="md:hidden p-2 text-textMuted hover:text-textPrimary cursor-pointer">
            <Icon name="menu" size={20} />
          </button>
          <div className="flex items-center gap-2 text-sm text-textMuted">
            <span className="text-textDim cursor-pointer hover:text-textPrimary" onClick={() => setView('dashboard')}>Dashboard</span>
            {currentTopicId && (
              <>
                <span className="text-textDim">/</span>
                <span className="text-textPrimary">{EXAM_TOPICS.find(t => t.id === currentTopicId)?.label}</span>
              </>
            )}
            {isMock && (
              <>
                <span className="text-textDim">/</span>
                <span className="text-textPrimary">Mock Exam</span>
              </>
            )}
          </div>
        </header>

        {/* Content */}
        <div className="flex-1 p-6 max-w-4xl w-full mx-auto">
          {view === 'dashboard' && (
            <Dashboard
              progress={progress}
              onTopicSelect={(id) => setView(`topic:${id}`)}
              onMockExam={() => setView('mock')}
              resetAll={resetAll}
            />
          )}
          {currentTopicId && (
            <ExamMode
              topicId={currentTopicId}
              onBack={() => setView('dashboard')}
              progress={progress}
              saveAnswer={saveAnswer}
            />
          )}
          {isMock && (
            <MockExam
              onBack={() => setView('dashboard')}
              progress={progress}
              saveAnswer={saveAnswer}
            />
          )}
        </div>
      </main>
    </div>
  );
};

// ─── MOUNT ───────────────────────────────────────────────────────────────────

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
</script>
</body>
</html>
